<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>عرض وكولاج PR Agency</title>
  <link rel="icon" type="image/png" href="/assets/logos/pr-agency.png" />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #090812;
      --surface: #120f24;
      --accent: #8b5cf6;
      --border: rgba(168, 85, 247, 0.3);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 40px 20px;
      background: var(--bg);
      color: #fff;
      font-family: 'Cairo', sans-serif;
      min-height: 100vh;
    }
    .deck-container {
      max-width: 820px;
      margin: 0 auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 44px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
    }
    .deck-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 24px;
      margin-bottom: 32px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .brand img {
      width: 56px;
      height: 56px;
      border-radius: 12px;
      object-fit: contain;
    }
    .brand h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 0.5px;
    }
    .brand span {
      font-size: 12px;
      color: #c4b5fd;
    }
    .client-box {
      background: rgba(139, 92, 246, 0.1);
      border: 1px solid rgba(139, 92, 246, 0.25);
      border-radius: 14px;
      padding: 16px 20px;
      margin-bottom: 28px;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }
    .content-body {
      font-size: 16px;
      line-height: 1.9;
      color: #f1f5f9;
      white-space: pre-wrap;
      min-height: 220px;
    }
    .deck-footer {
      margin-top: 40px;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: #a1a1aa;
    }
    .print-bar {
      max-width: 820px;
      margin: 0 auto 20px;
      display: flex;
      justify-content: flex-end;
      gap: 12px;
    }
    .btn-print {
      background: linear-gradient(135deg, #8b5cf6, #7c3aed);
      color: #fff;
      border: none;
      padding: 12px 24px;
      border-radius: 12px;
      font-family: inherit;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
    }
    @media print {
      body { background: #fff; color: #111; padding: 0; }
      .print-bar { display: none; }
      .deck-container {
        background: #fff;
        color: #111;
        border: none;
        box-shadow: none;
        padding: 20px;
      }
      .brand span, .deck-footer { color: #555; }
      .content-body { color: #111; }
      .client-box { background: #f5f3ff; border-color: #ddd6fe; color: #111; }
    }
  </style>
</head>
<body>
  <div class="print-bar">
    <button class="btn-print" onclick="window.print()">🖨️ طباعة / حفظ كـ PDF</button>
  </div>

  <div class="deck-container">
    <div class="deck-header">
      <div class="brand">
        <img src="/assets/logos/pr-agency.png" alt="PR Agency" />
        <div>
          <h1>PR AGENCY</h1>
          <span>وكالة التسويق المتكامل والإنتاج السينمائي</span>
        </div>
      </div>
      <div style="text-align:left; font-size:12px; color:#a1a1aa;">
        <div id="deck-date"></div>
        <div>pragency.pages.dev</div>
      </div>
    </div>

    <div class="client-box">
      <div><strong>مُقدم إلى:</strong> <span id="client-name">—</span></div>
      <div><strong>النشاط / الشركة:</strong> <span id="client-company">—</span></div>
    </div>

    <div class="content-body" id="deck-content"></div>

    <div class="deck-footer">
      <div>PR Agency — شريكك في النمو والمبيعات</div>
      <div>📱 01144826641 | 🌐 pragency.pages.dev</div>
    </div>
  </div>

  <script>
    (function() {
      const draft = JSON.parse(localStorage.getItem('pr_collage_draft') || '{}');
      document.getElementById('client-name').textContent = draft.clientName || 'عميلنا العزيز';
      document.getElementById('client-company').textContent = draft.company || 'PR Agency Client';
      document.getElementById('deck-content').textContent = draft.content || 'عرض تسويقي وإنتاج إعلاني متكامل من PR Agency.';
      document.getElementById('deck-date').textContent = new Date().toLocaleDateString('ar-EG', {
        year: 'numeric', month: 'long', day: 'numeric'
      });
    })();
  </script>
</body>
</html>
