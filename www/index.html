<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PR Agency Native App</title>
  <style>
    body { margin:0; background:#09090b; color:#fff; font-family:system-ui, -apple-system, sans-serif; display:flex; align-items:center; justify-content:center; height:100vh; text-align:center; }
    .loader { width:48px; height:48px; border:4px solid rgba(255,255,255,0.1); border-top-color:#38bdf8; border-radius:50%; animation:spin 1s linear infinite; margin:0 auto 16px; }
    @keyframes spin { to { transform:rotate(360deg); } }
  </style>
</head>
<body>
  <div>
    <div class="loader"></div>
    <h2 style="font-weight:700;">PR Agency Native</h2>
    <p style="color:#94a3b8;font-size:14px;">جاري تحميل النظام السحابي...</p>
  </div>
</body>
</html>
