<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex"/>
  <meta name="googlebot" content="noindex, nofollow"/>
  <title>بوابة العميل — جدول واعتماد المحتوى | PR Agency Portal</title>
  <link rel="icon" type="image/png" href="/assets/logos/pr-agency.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/main.css?v=84"/>
  <link rel="stylesheet" href="css/pages.css?v=84"/>
  <style>
    :root {
      --portal-bg: #07050d;
      --portal-surface: #100c1c;
      --portal-card: #161224;
      --portal-border: rgba(168, 85, 247, 0.2);
      --portal-accent: #8b5cf6;
      --portal-success: #10b981;
      --portal-danger: #ef4444;
      --portal-warning: #f59e0b;
    }
    body {
      background: var(--portal-bg);
      color: #fff;
      font-family: 'Cairo', sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
    }
    /* Header */
    .portal-nav {
      background: rgba(16, 12, 28, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--portal-border);
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .portal-brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .portal-brand img {
      width: 44px;
      height: 44px;
      filter: drop-shadow(0 0 10px rgba(139, 92, 246, 0.5));
    }
    .portal-brand-text h2 {
      font-size: 17px;
      font-weight: 800;
      margin: 0;
      color: #fff;
    }
    .portal-brand-text span {
      font-size: 12px;
      color: #a1a1aa;
    }
    .portal-user-area {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .portal-client-badge {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(139, 92, 246, 0.12);
      border: 1px solid var(--portal-border);
      padding: 6px 14px;
      border-radius: 999px;
    }
    .portal-client-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      object-fit: cover;
      background: #8b5cf6;
    }
    .portal-client-name {
      font-size: 13px;
      font-weight: 700;
      color: #e4e4e7;
    }
    .btn-logout {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-logout:hover {
      background: rgba(239, 68, 68, 0.25);
      border-color: #ef4444;
    }

    /* Container */
    .portal-container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 32px 20px 80px;
    }

    /* Summary Stats */
    .portal-stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 32px;
    }
    .stat-card {
      background: var(--portal-surface);
      border: 1px solid var(--portal-border);
      border-radius: 16px;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
    }
    .stat-info h3 {
      font-size: 13px;
      color: #a1a1aa;
      margin: 0 0 6px;
      font-weight: 600;
    }
    .stat-info p {
      font-size: 26px;
      font-weight: 900;
      margin: 0;
      color: #fff;
    }
    .stat-icon {
      font-size: 28px;
      padding: 10px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.04);
    }

    /* Controls Bar */
    .portal-controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 28px;
      background: var(--portal-surface);
      border: 1px solid var(--portal-border);
      padding: 16px 20px;
      border-radius: 16px;
    }
    .month-selector {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .month-selector h2 {
      font-size: 18px;
      margin: 0;
      font-weight: 800;
      min-width: 160px;
    }
    .view-toggle {
      display: flex;
      background: rgba(0, 0, 0, 0.3);
      padding: 4px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      gap: 4px;
    }
    .toggle-btn {
      background: none;
      border: none;
      color: #a1a1aa;
      padding: 6px 14px;
      border-radius: 8px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .toggle-btn.active {
      background: var(--portal-accent);
      color: #fff;
      box-shadow: 0 2px 10px rgba(139, 92, 246, 0.4);
    }

    /* Deliverables Grid */
    .deliverables-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 24px;
    }
    .del-card {
      background: var(--portal-card);
      border: 1px solid var(--portal-border);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
      transition: transform 0.25s, border-color 0.25s;
      display: flex;
      flex-direction: column;
    }
    .del-card:hover {
      transform: translateY(-4px);
      border-color: rgba(168, 85, 247, 0.5);
    }
    .del-media-wrap {
      position: relative;
      aspect-ratio: 16 / 10;
      background: #000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .del-media-wrap img, .del-media-wrap video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .del-type-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      backdrop-filter: blur(8px);
      z-index: 2;
    }
    .badge-video { background: rgba(225, 48, 108, 0.85); color: #fff; }
    .badge-design { background: rgba(59, 130, 246, 0.85); color: #fff; }
    .badge-pdf { background: rgba(245, 158, 11, 0.85); color: #fff; }

    .del-status-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
      backdrop-filter: blur(8px);
      z-index: 2;
    }
    .status-pending { background: rgba(245, 158, 11, 0.2); border: 1px solid #f59e0b; color: #fbbf24; }
    .status-approved { background: rgba(16, 185, 129, 0.2); border: 1px solid #10b981; color: #34d399; }
    .status-rejected { background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; color: #f87171; }

    .del-content {
      padding: 20px;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
    }
    .del-date-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 12px;
      color: #a1a1aa;
    }
    .del-title {
      font-size: 16px;
      font-weight: 800;
      margin: 0 0 10px;
      color: #fff;
      line-height: 1.4;
    }
    .del-caption-box {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 13px;
      color: #d4d4d8;
      max-height: 80px;
      overflow-y: auto;
      margin-bottom: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
    }
    .del-hashtags {
      font-size: 11px;
      color: #8b5cf6;
      margin-bottom: 16px;
      direction: ltr;
      text-align: right;
    }

    /* Action Buttons */
    .del-actions {
      margin-top: auto;
      padding-top: 14px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      gap: 10px;
    }
    .btn-action {
      flex: 1;
      padding: 10px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      font-family: inherit;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .btn-approve {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #34d399;
    }
    .btn-approve:hover {
      background: #10b981;
      color: #fff;
    }
    .btn-reject {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #f87171;
    }
    .btn-reject:hover {
      background: #ef4444;
      color: #fff;
    }
    .btn-preview {
      background: rgba(139, 92, 246, 0.15);
      border: 1px solid rgba(139, 92, 246, 0.4);
      color: #c4b5fd;
    }
    .btn-preview:hover {
      background: #8b5cf6;
      color: #fff;
    }

    /* Modal for Review & Feedback */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(8px);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-card {
      background: #140f24;
      border: 1px solid var(--portal-border);
      border-radius: 24px;
      width: 100%;
      max-width: 600px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 28px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8);
      position: relative;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .modal-title {
      font-size: 18px;
      font-weight: 800;
      margin: 0;
    }
    .modal-close {
      background: none;
      border: none;
      color: #a1a1aa;
      font-size: 20px;
      cursor: pointer;
    }
    .modal-textarea {
      width: 100%;
      padding: 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      color: #fff;
      font-family: inherit;
      font-size: 14px;
      min-height: 110px;
      resize: vertical;
      margin: 16px 0;
      box-sizing: border-box;
    }
    .modal-textarea:focus {
      outline: none;
      border-color: #8b5cf6;
    }
  </style>
</head>
<body>

  <!-- Top Navigation -->
  <header class="portal-nav">
    <div class="portal-brand">
      <img src="/assets/logos/pr-agency.png" alt="PR Agency"/>
      <div class="portal-brand-text">
        <h2>PR Agency Client Hub</h2>
        <span>بوابة متابعة واعتماد الروزنامة</span>
      </div>
    </div>

    <div class="portal-user-area">
      <div class="portal-client-badge">
        <img id="client-logo" class="portal-client-avatar" src="/assets/logos/pr-agency.png" alt=""/>
        <span id="client-company-name" class="portal-client-name">جاري التحميل...</span>
      </div>
      <button id="logout-btn" class="btn-logout">تسجيل الخروج</button>
    </div>
  </header>

  <main class="portal-container">

    <!-- Overview Stats -->
    <section class="portal-stats-grid">
      <div class="stat-card">
        <div class="stat-info">
          <h3>إجمالي المحتوى</h3>
          <p id="stat-total">0</p>
        </div>
        <div class="stat-icon">📅</div>
      </div>
      <div class="stat-card">
        <div class="stat-info">
          <h3>بانتظار موافقتك</h3>
          <p id="stat-pending" style="color:#fbbf24;">0</p>
        </div>
        <div class="stat-icon">⏳</div>
      </div>
      <div class="stat-card">
        <div class="stat-info">
          <h3>تم اعتمادها</h3>
          <p id="stat-approved" style="color:#34d399;">0</p>
        </div>
        <div class="stat-icon">✅</div>
      </div>
      <div class="stat-card">
        <div class="stat-info">
          <h3>مطلوب تعديل</h3>
          <p id="stat-rejected" style="color:#f87171;">0</p>
        </div>
        <div class="stat-icon">✍️</div>
      </div>
    </section>

    <!-- Controls -->
    <div class="portal-controls">
      <div class="month-selector">
        <span style="font-size: 20px;">🗓️</span>
        <h2 id="current-month-display">روزنامة الشهر الحالي</h2>
      </div>

      <div class="view-toggle">
        <button class="toggle-btn active" id="filter-all" onclick="filterItems('all')">الكل</button>
        <button class="toggle-btn" id="filter-pending" onclick="filterItems('pending')">بانتظار الموافقة</button>
        <button class="toggle-btn" id="filter-approved" onclick="filterItems('approved')">المعتمدة</button>
        <button class="toggle-btn" id="filter-rejected" onclick="filterItems('rejected')">مطلوب تعديل</button>
      </div>
    </div>

    <!-- Deliverables Cards Grid -->
    <div id="deliverables-container" class="deliverables-grid">
      <div style="text-align: center; grid-column: 1 / -1; padding: 60px; color: #a1a1aa;">
        جاري تحميل جدول المحتوى...
      </div>
    </div>

  </main>

  <!-- Review Modal -->
  <div id="review-modal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="modal-item-title" class="modal-title">مراجعة المحتوى</h3>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>

      <div id="modal-preview-area" style="margin-bottom: 16px; border-radius: 12px; overflow: hidden; background: #000; max-height: 320px; display: flex; align-items: center; justify-content: center;">
      </div>

      <div style="margin-bottom: 12px;">
        <label style="font-size: 13px; font-weight: 700; color: #e4e4e7;">الكابشن المقترح:</label>
        <div id="modal-caption-text" style="background: rgba(0,0,0,0.4); padding: 10px 14px; border-radius: 10px; font-size: 13px; color: #d4d4d8; margin-top: 6px; white-space: pre-wrap;"></div>
      </div>

      <div>
        <label for="review-comment" style="font-size: 13px; font-weight: 700; color: #e4e4e7;">
          ملاحظاتك أو تعليقك (اختياري عند الموافقة، إلزامي عند طلب تعديل):
        </label>
        <textarea id="review-comment" class="modal-textarea" placeholder="اكتب ملاحظاتك لفريق الوكالة هنا..."></textarea>
      </div>

      <div style="display: flex; gap: 12px;">
        <button id="modal-btn-approve" class="btn-action btn-approve" style="padding: 14px;" onclick="submitReview('approved')">
          <span>✅ اعتماد المحتوى</span>
        </button>
        <button id="modal-btn-reject" class="btn-action btn-reject" style="padding: 14px;" onclick="submitReview('rejected')">
          <span>❌ طلب تعديل</span>
        </button>
      </div>
    </div>
  </div>

  <script>
    let currentClient = null;
    let allDeliverables = [];
    let activeFilter = 'all';
    let currentReviewItem = null;

    // Check auth
    async function init() {
      try {
        const res = await fetch('/api/portal/auth');
        const data = await res.json();
        if (!data.authenticated) {
          window.location.href = '/portal-access-2026';
          return;
        }
        currentClient = data.client;
        document.getElementById('client-company-name').textContent = currentClient.companyName;
        if (currentClient.logoUrl) {
          document.getElementById('client-logo').src = currentClient.logoUrl;
        }

        await loadCalendar();
      } catch (e) {
        window.location.href = '/portal-access-2026';
      }
    }

    async function loadCalendar() {
      try {
        const res = await fetch('/api/portal/calendar');
        const data = await res.json();
        if (data.success) {
          allDeliverables = data.items || [];
          document.getElementById('stat-total').textContent = data.stats.total;
          document.getElementById('stat-pending').textContent = data.stats.pending;
          document.getElementById('stat-approved').textContent = data.stats.approved;
          document.getElementById('stat-rejected').textContent = data.stats.rejected;
          renderItems();
        }
      } catch (e) {
        console.error('Error loading calendar:', e);
      }
    }

    function renderItems() {
      const container = document.getElementById('deliverables-container');
      const filtered = activeFilter === 'all' 
        ? allDeliverables 
        : allDeliverables.filter(i => i.status === activeFilter);

      if (filtered.length === 0) {
        container.innerHTML = `
          <div style="text-align: center; grid-column: 1 / -1; padding: 60px; color: #a1a1aa; background: var(--portal-surface); border-radius: 20px;">
            <p style="font-size: 32px; margin: 0 0 10px;">✨</p>
            <h3 style="color:#fff; margin:0 0 8px;">لا يوجد محتوى في هذا القسم حالياً</h3>
            <p style="font-size:13px; margin:0;">سيتم رفع أي فيديوهات وتصاميم جديدة من قِبل فريق PR Agency فور تجهيزها.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(item => {
        const typeBadge = item.type === 'video' ? '🎬 فيديو ريلز' : item.type === 'pdf' ? '📑 ملف PDF' : '🎨 بوست وتصميم';
        const typeClass = item.type === 'video' ? 'badge-video' : item.type === 'pdf' ? 'badge-pdf' : 'badge-design';
        
        const statusText = item.status === 'approved' ? '✅ معتمد' : item.status === 'rejected' ? '❌ مطلوب تعديل' : '⏳ بانتظار الموافقة';
        const statusClass = item.status === 'approved' ? 'status-approved' : item.status === 'rejected' ? 'status-rejected' : 'status-pending';

        const mediaPreview = item.type === 'video' 
          ? `<video src="${item.media_url}" poster="${item.thumbnail_url || ''}" controls preload="metadata" style="max-height:220px;"></video>`
          : item.type === 'pdf'
          ? `<div style="text-align:center; padding:30px;"><a href="${item.media_url}" target="_blank" style="color:#fbbf24; text-decoration:none; font-size:14px; font-weight:700;">📄 فتح واستعراض ملف الـ PDF</a></div>`
          : `<img src="${item.media_url}" alt="${item.title}" loading="lazy"/>`;

        return `
          <div class="del-card">
            <div class="del-media-wrap">
              <span class="del-type-badge ${typeClass}">${typeBadge}</span>
              <span class="del-status-badge ${statusClass}">${statusText}</span>
              ${mediaPreview}
            </div>

            <div class="del-content">
              <div class="del-date-row">
                <span>📅 موعد النشر: <strong>${item.scheduled_date}</strong></span>
                <span>⏰ ${item.scheduled_time || '18:00'}</span>
              </div>
              <h4 class="del-title">${item.title}</h4>
              
              <div class="del-caption-box">${item.caption || 'بدون كابشن'}</div>
              <div class="del-hashtags">${item.hashtags || ''}</div>

              ${item.client_feedback ? `
                <div style="background:rgba(239,68,68,0.1); border:1px solid rgba(239,68,68,0.3); border-radius:8px; padding:8px 12px; margin-bottom:12px; font-size:12px; color:#fca5a5;">
                  <strong>ملاحظات سابقة:</strong> ${item.client_feedback}
                </div>
              ` : ''}

              <div class="del-actions">
                <button class="btn-action btn-preview" onclick="openReviewModal('${item.id}')">
                  <span>💬 مراجعة وكتابة تعليق</span>
                </button>
                ${item.status !== 'approved' ? `
                  <button class="btn-action btn-approve" onclick="quickApprove('${item.id}')">
                    <span>✅ موافقة فورية</span>
                  </button>
                ` : ''}
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function filterItems(status) {
      activeFilter = status;
      document.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('filter-' + status).classList.add('active');
      renderItems();
    }

    function openReviewModal(id) {
      const item = allDeliverables.find(i => i.id === id);
      if (!item) return;
      currentReviewItem = item;

      document.getElementById('modal-item-title').textContent = item.title;
      document.getElementById('modal-caption-text').textContent = item.caption || 'لا يوجد كابشن';
      document.getElementById('review-comment').value = item.client_feedback || '';

      const previewArea = document.getElementById('modal-preview-area');
      if (item.type === 'video') {
        previewArea.innerHTML = `<video src="${item.media_url}" controls autoplay style="max-height:300px; width:100%;"></video>`;
      } else if (item.type === 'pdf') {
        previewArea.innerHTML = `<a href="${item.media_url}" target="_blank" class="btn btn-primary" style="padding:12px 24px; text-decoration:none;">📄 فتح ملف الـ PDF في نافذة جديدة</a>`;
      } else {
        previewArea.innerHTML = `<img src="${item.media_url}" alt="" style="max-height:300px; max-width:100%; object-fit:contain;"/>`;
      }

      document.getElementById('review-modal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('review-modal').style.display = 'none';
      const v = document.getElementById('modal-preview-area').querySelector('video');
      if (v) v.pause();
    }

    async function submitReview(status) {
      if (!currentReviewItem) return;
      const feedback = document.getElementById('review-comment').value.trim();

      if (status === 'rejected' && !feedback) {
        alert('يرجى كتابة الملاحظات والتعديلات المطلوبة حتى يقوم الفريق بتنفيذها فوراً.');
        return;
      }

      try {
        const res = await fetch('/api/portal/review', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            deliverableId: currentReviewItem.id,
            status,
            feedback
          })
        });
        const data = await res.json();
        if (data.success) {
          closeModal();
          await loadCalendar();
        } else {
          alert(data.error || 'فشلت المراجعة');
        }
      } catch (e) {
        alert('حدث خطأ في الاتصال');
      }
    }

    async function quickApprove(id) {
      if (!confirm('هل تود اعتماد هذا المحتوى للنشر في الموعد المحدد؟')) return;
      try {
        const res = await fetch('/api/portal/review', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ deliverableId: id, status: 'approved' })
        });
        const data = await res.json();
        if (data.success) {
          await loadCalendar();
        }
      } catch (e) {
        alert('حدث خطأ في الاتصال');
      }
    }

    document.getElementById('logout-btn').addEventListener('click', async () => {
      await fetch('/api/portal/auth', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'logout' }) });
      sessionStorage.removeItem('pr_client');
      window.location.href = '/portal-access-2026';
    });

    init();
  </script>
</body>
</html>
