  <style>
    .case-studies-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 32px;
      margin: 40px auto 80px;
      max-width: 1200px;
      padding: 0 24px;
    }
    .cs-card {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 28px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.3s;
      text-decoration: none;
      color: inherit;
    }
    .cs-card:hover {
      transform: translateY(-6px);
      border-color: #8B5CF6;
      box-shadow: 0 16px 36px rgba(139, 92, 246, 0.2);
    }
    .cs-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .cs-logo {
      height: 48px;
      max-width: 130px;
      object-fit: contain;
      filter: brightness(1.2);
    }
    .cs-badge {
      background: rgba(139, 92, 246, 0.15);
      border: 1px solid rgba(139, 92, 246, 0.3);
      color: #C4B5FD;
      font-size: 0.78rem;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 12px;
    }
    .cs-name {
      font-size: 1.35rem;
      font-weight: 800;
      color: #FFFFFF;
      margin: 0 0 10px;
    }
    .cs-result-highlight {
      font-size: 0.95rem;
      color: #94A3B8;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .cs-metrics {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 24px;
      padding: 16px;
      background: rgba(0, 0, 0, 0.25);
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.04);
    }
    .cs-metric-item {
      text-align: center;
    }
    .cs-metric-val {
      font-size: 1.25rem;
      font-weight: 900;
      color: #10B981;
      display: block;
    }
    .cs-metric-lbl {
      font-size: 0.75rem;
      color: #94A3B8;
    }
    .cs-cta-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 20px;
      border-radius: 12px;
      background: linear-gradient(135deg, #8B5CF6, #7C3AED);
      color: #fff;
      font-weight: 700;
      font-size: 0.9rem;
      transition: opacity 0.2s;
    }
    .cs-card:hover .cs-cta-btn {
      opacity: 0.95;
    }
    .cs-skeleton {
      min-height: 320px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 20px;
      animation: pulse 1.5s infinite ease-in-out;
    }
    @keyframes pulse {
      0% { opacity: 0.5; }
      50% { opacity: 0.9; }
      100% { opacity: 0.5; }
    }
  </style>
